# /etc/apache2/sites-available/portfolio-site.conf
# Reverse proxy: public :80/:443 -> Next.js on :4000 (managed by PM2)
# Requires: sudo a2enmod proxy proxy_http

<VirtualHost *:80>
    ServerName subhankar.baseweb.in

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:4000/
    ProxyPassReverse / http://127.0.0.1:4000/

    ErrorLog ${APACHE_LOG_DIR}/portfolio-site-error.log
    CustomLog ${APACHE_LOG_DIR}/portfolio-site-access.log combined
</VirtualHost>
